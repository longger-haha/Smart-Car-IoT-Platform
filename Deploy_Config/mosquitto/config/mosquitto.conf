# ============================================================
# mosquitto.conf — Eclipse Mosquitto 配置文件
# SmartRover IoT 安全平台 MQTT Broker 配置
# ============================================================

# ── 监听端口 ─────────────────────────────────────────────────
# 明文 MQTT 端口（容器内部通信，外部通过 Docker 网络隔离）
listener 1883

# ── 访问控制 ─────────────────────────────────────────────────
# 禁止匿名连接（必须使用账号密码）
allow_anonymous false

# 密码文件路径（容器内路径；由 mosquitto_passwd 工具生成）
# 初始化步骤见 Docs/COLLABORATION_GUIDE.md
password_file /mosquitto/config/passwd

# ACL 权限控制文件（可选，按需启用）
# acl_file /mosquitto/config/acl

# ── 持久化 ───────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── 日志 ─────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# ── 连接超时与 QoS ────────────────────────────────────────────
# 60 秒内未收到 PING 则断开
keepalive_interval 60

# 最大并发连接数（答辩演示级别，设置宽松）
max_connections 100

# ── TLS (Phase 7 启用，本阶段注释) ──────────────────────────
# 如需开启 TLS，取消以下注释并提供对应证书文件
# listener 8883
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# tls_version tlsv1.2
